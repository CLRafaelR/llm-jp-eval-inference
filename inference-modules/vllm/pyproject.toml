[project]
name = "inference-modules-vllm"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.11, <3.13"
dependencies = [
    "llm-jp-eval-inference",
    "torch>=2.10.0",
    "torchvision",
    "torchaudio",
    "vllm",
    # "vllm>=0.19.1",
    # Gemma 4 系 tokenizer_config.json が `extra_special_tokens` を list で持つのに、
    # transformers 4.x は dict 前提で AttributeError になるため 5.6+ を要求。
    "transformers>=5.6.0",
    "flash-linear-attention>=0.5.2",
    "causal-conv1d>=1.7.0",
]

[tool.uv]
no-binary-package = ["pyairports"]
# Override transitive dep upper bounds from llm-jp-eval (unbabel-comet, langchain, etc.).
# These packages are not used in inference modules, so this is safe.
override-dependencies = [
    "protobuf>=5.29.6,<7",
    "numpy>=2.0.0",
    "pyarrow>=16.0.0",
    "wandb>=0.19.6,<0.20.dev0",
    "openai>=2.0.0",
    "langchain-openai>=0.2.0",
    "langchain>=0.3.0",
    "langchain-community>=0.3.0",
    "langchain-huggingface>=0.1.0",
    "pydantic-settings>=2.10.1",
    # unbabel-comet は transformers<5 / huggingface-hub<1 を要求するが、推論モジュールでは未使用。
    "transformers>=5.6.0",
    "huggingface-hub>=1.31.0,<3.0",
]

[tool.uv.sources]
llm-jp-eval-inference = { path = "../../", editable = true }
transformers = { git = "https://github.com/huggingface/transformers", branch = "add-jev-models" }
torch = { index = "pytorch-cu130" }
torchvision = { index = "pytorch-cu130" }
torchaudio = { index = "pytorch-cu130" }
vllm = { index = "vllm-git-system-one" }

[[tool.uv.index]]
name = "vllm-git-system-one"
url = "https://wheels.vllm.ai/6ecb39eaa7c55b26afd39b76a87b44f33053bdff"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[tool.uv.extra-build-dependencies]
causal-conv1d = [{ requirement = "torch", match-runtime = true }]
